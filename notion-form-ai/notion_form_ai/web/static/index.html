<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notion Form AI</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --border: #2a2f3a;
    --text: #e8eaf0; --dim: #8b93a5; --accent: #4f8cff; --user: #24304a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header button {
    margin-left: auto; background: none; border: 1px solid var(--border);
    color: var(--dim); border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 72ch; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user { background: var(--user); align-self: flex-end; }
  .bot  { background: var(--panel); border: 1px solid var(--border); align-self: flex-start; }
  .tool {
    align-self: flex-start; color: var(--dim); font-size: 12.5px;
    font-family: ui-monospace, monospace; padding: 0 4px;
  }
  .tool.err { color: #e07a7a; }
  form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  form button {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 15px; cursor: pointer;
  }
  form button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--dim); font-size: 13px; align-self: center; margin-top: 30vh; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🤖 Notion Form AI</h1>
  <button id="reset">New chat</button>
</header>
<div id="log">
  <div class="hint" id="hint">
    Ask me to fill anything —<br/>
    “log a $40 dinner expense for yesterday”,<br/>
    “create this week’s review from my template”,<br/>
    “fill the sign-up form at &lt;url&gt; with my details”.
  </div>
</div>
<form id="form">
  <input id="input" placeholder="What should I fill in?" autocomplete="off" autofocus />
  <button id="send" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let sessionId = null;

  function add(cls, text) {
    const hint = document.getElementById("hint");
    if (hint) hint.remove();
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("msg user", text);
    const pending = add("tool", "working…");
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        add("tool err", "error: " + (data.detail || res.statusText));
        return;
      }
      sessionId = data.session_id;
      for (const ev of data.events || []) {
        if (ev.type === "tool_use") add("tool", "⚙ " + ev.name);
        else if (ev.type === "tool_result" && ev.is_error)
          add("tool err", "✗ " + ev.name + ": " + (ev.result || "").slice(0, 160));
      }
      add("msg bot", data.reply);
    } catch (err) {
      pending.remove();
      add("tool err", "network error: " + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    if (sessionId) {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      }).catch(() => {});
    }
    sessionId = null;
    log.innerHTML = '<div class="hint" id="hint">New conversation started.</div>';
  });
</script>
</body>
</html>
