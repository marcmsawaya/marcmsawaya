[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-form-ai"
version = "0.1.0"
description = "An AI agent that fills Notion databases, page templates, Notion forms, and external web forms from natural-language requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marc Sawaya" }]
dependencies = [
    "anthropic>=0.49.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
telegram = ["python-telegram-bot>=21.0"]
browser = ["playwright>=1.44.0"]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-telegram-bot>=21.0",
    "playwright>=1.44.0",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
notion-ai = "notion_form_ai.cli:main"
notion-ai-web = "notion_form_ai.web.server:main"
notion-ai-telegram = "notion_form_ai.telegram_bot:main"

[tool.setuptools.packages.find]
include = ["notion_form_ai*"]

[tool.setuptools.package-data]
"notion_form_ai.web" = ["static/*.html"]
